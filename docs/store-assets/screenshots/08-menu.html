<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اسکرین‌شات ۸ — منو</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    .drawer { width: 75%; background: #0d1525; height: 100%; padding: 40px 28px; border-left: 1px solid rgba(34,211,238,0.15); }
    .drawer-item { padding: 22px 16px; font-size: 30px; border-radius: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 16px; }
    .drawer-item.active { background: rgba(34,211,238,0.1); color: #22D3EE; font-weight: 700; }
    .drawer-item span.icon { font-size: 28px; }
    .main-dim { flex: 1; background: rgba(0,0,0,0.5); }
    .screen { flex-direction: row; padding: 0; }
    .trial-badge { color: #FBBF24; font-size: 22px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="drawer">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
        <div class="logo-icon" style="width:64px;height:64px;font-size:32px;margin:0">پ</div>
        <div>
          <div style="font-weight:800;font-size:32px;background:linear-gradient(90deg,#22D3EE,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent">پوشه</div>
          <div style="color:#8BA3B8;font-size:22px">دفتر املاک نمونه</div>
          <div class="trial-badge">۴۸ ساعت رایگان</div>
        </div>
      </div>
      <div class="drawer-item active"><span class="icon">📊</span> داشبورد</div>
      <div class="drawer-item"><span class="icon">🏢</span> املاک</div>
      <div class="drawer-item"><span class="icon">👤</span> مالکین</div>
      <div class="drawer-item"><span class="icon">👥</span> مشتریان</div>
      <div class="drawer-item"><span class="icon">📋</span> مدیریت فروش</div>
      <div class="drawer-item"><span class="icon">💰</span> حسابداری</div>
      <div class="drawer-item"><span class="icon">📈</span> گزارش‌ها</div>
      <div class="drawer-item"><span class="icon">⚙️</span> تنظیمات</div>
    </div>
    <div class="main-dim"></div>
    <div class="caption-bar">
      <h2>منوی کامل — همگام با وب</h2>
      <p>تمام ماژول‌های دفتر املاک در یک اپ</p>
    </div>
  </div>
</body>
</html>
