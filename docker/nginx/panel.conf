# panel.posheapp.ir — ONLY super-admin SPA (panel.html, never landing index.html)
server {
    listen 80;
    server_name panel.posheapp.ir;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    location = /up {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ^~ /downloads/ {
        root /var/www/frontend;
        try_files $uri =404;
        expires 1d;
    }

    # Panel SPA — fallback MUST be panel.html (not index.html / landing)
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /panel.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
