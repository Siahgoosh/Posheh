# Bot detection for SEO prerender (must be outside server{} block)
map $http_user_agent $is_search_bot {
    default 0;
    ~*googlebot 1;
    ~*Googlebot 1;
    ~*Google-InspectionTool 1;
    ~*bingbot 1;
    ~*yandex 1;
    ~*baiduspider 1;
    ~*duckduckbot 1;
    ~*slurp 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*embedly 1;
    ~*wget 1;
    ~*curl 1;
    ~*petalbot 1;
}

server {
    listen 80;
    server_name posheapp.ir www.posheapp.ir *.posheapp.ir localhost;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /up {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        root /var/www/frontend;
        try_files /robots.txt =404;
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        rewrite ^ /api/v1/sitemap.xml last;
    }

    location ^~ /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = / {
        if ($is_search_bot = 1) {
            rewrite ^ /index.php?$query_string last;
        }
        root /var/www/frontend;
        try_files $uri /index.html;
    }

    location ~ ^/blog(/.*)?$ {
        if ($is_search_bot = 1) {
            rewrite ^ /index.php?$query_string last;
        }
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ^~ /downloads/ {
        root /var/www/frontend;
        try_files $uri @download_api;
        expires 1d;
        add_header Cache-Control "public";
        types {
            application/vnd.android.package-archive apk;
            application/zip zip;
            application/octet-stream bin;
        }
    }

    location @download_api {
        rewrite ^/downloads/(.*)$ /api/v1/downloads/file/$1 last;
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
