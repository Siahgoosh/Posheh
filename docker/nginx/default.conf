server {
    listen 80;
    # Apex, www, and every office subdomain (name.posheapp.ir) are served by
    # the same SPA + API. The frontend detects the subdomain from the hostname
    # and renders that office's public website.
    server_name posheapp.ir www.posheapp.ir *.posheapp.ir localhost;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Laravel health check
    location = /up {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    # Uploaded files (blog images, app downloads)
    location ^~ /storage/ {
        alias /var/www/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Laravel API
    location ^~ /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static app downloads (APK/ZIP) — must not fall through to SPA index.html
    location ^~ /downloads/ {
        root /var/www/frontend;
        try_files $uri @download_api;
        expires 1d;
        add_header Cache-Control "public";
        types {
            application/vnd.android.package-archive apk;
            application/zip zip;
            application/octet-stream bin;
        }
    }

    location @download_api {
        rewrite ^/downloads/(.*)$ /api/v1/downloads/file/$1 last;
    }

    # React SPA (production build in frontend/dist)
    location = /index.html {
        root /var/www/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /panel.html {
        root /var/www/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
