# Web panel + webmail for mail.posheapp.ir
# Uses Docker DNS resolver so nginx still starts when Mailu is offline.
server {
    listen 80;
    server_name mail.posheapp.ir;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mailu_upstream mailu-front;

    location / {
        proxy_pass http://$mailu_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
        proxy_connect_timeout 5s;
    }

    error_page 502 503 504 = @mail_offline;
    location @mail_offline {
        default_type text/html;
        return 503 '<!DOCTYPE html><html lang="fa" dir="rtl"><body style="font-family:sans-serif;text-align:center;padding:3rem"><h1>سرویس ایمیل در حال راه‌اندازی</h1><p>mail.posheapp.ir هنوز فعال نشده. روی سرور: <code>./scripts/setup-mail.sh</code></p></body></html>';
    }
}
