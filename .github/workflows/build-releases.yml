name: Build Android & Windows

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-releases.yml'
      - 'scripts/build-releases.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-releases-${{ github.ref }}
  cancel-in-progress: true

env:
  # Server currently serves the API over HTTP only; switch to https once TLS is configured.
  API_URL: https://posheapp.ir/api/v1

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: posheh-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}

      - name: Package Windows release
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Windows build output not found at $src" }
          Compress-Archive -Path "$src/*" -DestinationPath "../posheh-windows.zip" -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: posheh-windows-zip
          path: posheh-windows.zip
          if-no-files-found: error

  publish-downloads:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: posheh-android-apk
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: posheh-windows-zip
          path: artifacts/windows

      - name: Copy release files
        run: |
          mkdir -p frontend/public/downloads
          cp artifacts/android/app-release.apk frontend/public/downloads/posheh-android.apk
          cp artifacts/windows/posheh-windows.zip frontend/public/downloads/posheh-windows.zip
          ls -lh frontend/public/downloads/

      - name: Commit and push downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/posheh-android.apk frontend/public/downloads/posheh-windows.zip
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update Android APK and Windows release [skip ci]"
          git push
