name: Build Android & Windows

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-releases.yml'
      - '.github/workflows/generate-android-keystore.yml'
      - 'scripts/build-releases.sh'
      - 'scripts/android-signing-ci.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-releases-${{ github.ref }}
  cancel-in-progress: true

env:
  # Server currently serves the API over HTTP only; switch to https once TLS is configured.
  API_URL: https://posheapp.ir/api/v1

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Configure Android release signing
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/android-signing-ci.sh

      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}
      - run: flutter build appbundle --release --dart-define=API_URL=${{ env.API_URL }}

      - name: Verify APK signing (Play Protect / Cafe Bazaar)
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner not found — skipping cert verification"
            exit 0
          fi
          echo "=== APK certificate (must NOT be Android Debug) ==="
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -qi "Android Debug" /tmp/apk-certs.txt; then
            echo "::error::APK is debug-signed. Configure ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Release APK on main requires ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: posheh-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB (Cafe Bazaar)
        uses: actions/upload-artifact@v4
        with:
          name: posheh-android-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}

      - name: Package Windows release
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Windows build output not found at $src" }
          Compress-Archive -Path "$src/*" -DestinationPath "../posheh-windows.zip" -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: posheh-windows-zip
          path: posheh-windows.zip
          if-no-files-found: error

  publish-downloads:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: posheh-android-apk
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: posheh-windows-zip
          path: artifacts/windows

      - name: Copy release files
        run: |
          mkdir -p frontend/public/downloads
          cp artifacts/android/app-release.apk frontend/public/downloads/posheh-android.apk
          cp artifacts/windows/posheh-windows.zip frontend/public/downloads/posheh-windows.zip
          ls -lh frontend/public/downloads/
          if keytool -printcert -jarfile frontend/public/downloads/posheh-android.apk 2>/dev/null | grep -qi "Android Debug"; then
            echo "::warning::Published APK is debug-signed — not suitable for Cafe Bazaar production."
          fi

      - name: Commit and push downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/posheh-android.apk frontend/public/downloads/posheh-windows.zip
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if keytool -printcert -jarfile frontend/public/downloads/posheh-android.apk 2>/dev/null | grep -qi "Android Debug"; then
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "::error::Refusing to publish debug-signed APK while release secrets are configured."
              exit 1
            fi
            echo "::warning::Publishing debug-signed APK — configure ANDROID_KEYSTORE_* secrets for Cafe Bazaar."
          fi
          git commit -m "chore: update Android APK and Windows release [skip ci]"
          git push
