name: Generate Android Keystore

# Run once, then add the outputs to GitHub Repository Secrets.
# Settings → Secrets and variables → Actions → New repository secret

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (save it — needed for GitHub Secrets)'
        required: true
        type: string
      key_password:
        description: 'Key password (usually same as keystore password)'
        required: true
        type: string
      key_alias:
        description: 'Key alias'
        required: true
        default: posheh
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        env:
          STORE_PASS: ${{ inputs.store_password }}
          KEY_PASS: ${{ inputs.key_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          mkdir -p mobile/android
          keytool -genkey -v \
            -keystore mobile/android/posheh-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Posheh, OU=Mobile, O=Posheh, L=Tehran, ST=Tehran, C=IR"
          base64 -w0 mobile/android/posheh-release.jks > keystore-base64.txt
          wc -c mobile/android/posheh-release.jks keystore-base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: posheh-release-keystore
          path: |
            mobile/android/posheh-release.jks
            keystore-base64.txt
          retention-days: 14

      - name: Setup instructions
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Keystore generated

          Download artifact **posheh-release-keystore** and keep `posheh-release.jks` in a safe place.

          ### Add these Repository Secrets

          GitHub → **Settings** → **Secrets and variables** → **Actions** → **New repository secret**

          | Secret name | Value |
          |-------------|-------|
          | `ANDROID_KEYSTORE_BASE64` | entire contents of `keystore-base64.txt` (one line) |
          | `ANDROID_KEYSTORE_PASSWORD` | your keystore password |
          | `ANDROID_KEY_PASSWORD` | your key password |
          | `ANDROID_KEY_ALIAS` | alias below |

          EOF
          echo "**ANDROID_KEY_ALIAS:** \`$KEY_ALIAS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Then run **Build Android & Windows** workflow — the APK will be signed for Cafe Bazaar." >> "$GITHUB_STEP_SUMMARY"
