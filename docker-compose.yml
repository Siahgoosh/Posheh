services:
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: posheh-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - posheh
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: posheh-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/var/www/frontend
    networks:
      - posheh
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: posheh-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: posheh
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: posheh
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - posheh

  redis:
    image: redis:7-alpine
    container_name: posheh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - posheh

  queue:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: posheh-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
    networks:
      - posheh
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: posheh-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www
    networks:
      - posheh
    depends_on:
      - app

networks:
  posheh:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
